<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    
    <script>
      const BASE_URL = 'http://127.0.0.1:5000';
      fetch(`${BASE_URL}/client`, { method: 'GET' })
        .then((response) => {
          return response.json();
        })
        .then((data) => {
          console.log(data);
        })
        .catch((error) =>
          console.error('Hubo un error al hacer la petición a la API')
        );
    </script>
  </body>
</html>
